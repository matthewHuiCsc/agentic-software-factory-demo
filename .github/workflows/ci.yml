name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Monorepo and Compose journey
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      COMPOSE_PARALLEL_LIMIT: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.2

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Run unit and API tests
        run: |
          mkdir -p test-results
          pnpm test --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      - name: Build workspace packages and apps
        run: pnpm build

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.test.yml config --quiet

      - name: Run isolated PostgreSQL and RabbitMQ integration tests
        timeout-minutes: 10
        run: |
          docker compose -f docker-compose.test.yml run --build --rm backend-tests \
            2>&1 | tee test-results/integration.log

      - name: Build all images and wait for stack health
        timeout-minutes: 10
        run: |
          docker compose up --build --wait --wait-timeout 180
          docker compose ps

      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run customer, staff and failure-recovery browser journeys
        run: pnpm test:browser

      - name: Collect Compose diagnostics
        if: always()
        run: |
          mkdir -p test-results
          docker compose ps --all > test-results/compose-status.txt
          docker compose logs --no-color --timestamps > test-results/compose.log 2>&1
          docker compose -f docker-compose.test.yml ps --all > test-results/integration-status.txt
          docker compose -f docker-compose.test.yml logs --no-color --timestamps \
            > test-results/integration-services.log 2>&1

      - name: Upload test reports and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-reports-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up both Compose projects
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down --volumes --remove-orphans
          docker compose down --volumes --remove-orphans
